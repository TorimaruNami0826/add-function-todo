<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TODO アプリ</title>
  <style>
    /* ===== リセット & ベース ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', 'Hiragino Sans', sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
      min-height: 100vh;
    }

    /* ===== カードコンテナ ===== */
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
      padding: 32px;
      width: 100%;
      max-width: 520px;
      height: fit-content;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 24px;
      text-align: center;
      letter-spacing: .04em;
    }

    /* ===== 入力フォーム ===== */
    .input-row {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .input-controls {
      display: flex;
      gap: 8px;
    }

    #new-title {
      flex: 1;
      padding: 10px 14px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color .2s;
    }

    #new-priority {
      padding: 10px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      background-color: #fff;
      font-size: 0.9rem;
      cursor: pointer;
    }

    #new-title:focus, #new-priority:focus { border-color: #6366f1; outline: none; }

    #add-btn {
      padding: 10px 18px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
      white-space: nowrap;
    }

    #add-btn:hover { background: #4f46e5; }
    #add-btn:disabled { background: #a5b4fc; cursor: not-allowed; }

    /* ===== エラーメッセージ ===== */
    #error-msg {
      display: none;
      color: #dc2626;
      font-size: .875rem;
      margin-bottom: 16px;
      padding: 8px 12px;
      background: #fef2f2;
      border-radius: 6px;
    }

    /* ===== 絞り込みバー ===== */
    .filter-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .filter-row label {
      font-size: 0.85rem;
      color: #6b7280;
      white-space: nowrap;
    }

    #filter-priority {
      padding: 6px 10px;
      border: 1.5px solid #d1d5db;
      border-radius: 6px;
      background: #fff;
      font-size: 0.85rem;
      cursor: pointer;
    }

    #filter-priority:focus { outline: none; border-color: #6366f1; }

    /* ===== TODO リスト ===== */
    #todo-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      transition: border-color .2s, opacity .2s;
    }

    .todo-item.completed {
      opacity: .55;
      border-color: #d1d5db;
    }

    /* 完了チェックボックス */
    .todo-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #6366f1;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* タイトル */
    .todo-title {
      flex: 1;
      font-size: 1rem;
      color: #111827;
      word-break: break-all;
    }

    .todo-item.completed .todo-title {
      text-decoration: line-through;
      color: #9ca3af;
    }

    /* 優先度バッジ（カラーコード付き） */
    .priority-badge {
      font-size: 0.72rem;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .priority-badge.p1 { background: #fee2e2; color: #b91c1c; }  /* 高 */
    .priority-badge.p2 { background: #fef9c3; color: #a16207; }  /* 中 */
    .priority-badge.p3 { background: #dcfce7; color: #15803d; }  /* 低 */

    /* インライン優先度変更セレクト */
    .priority-select {
      padding: 3px 6px;
      border: 1.5px solid #e5e7eb;
      border-radius: 6px;
      font-size: 0.8rem;
      background: #fff;
      cursor: pointer;
      flex-shrink: 0;
    }

    .priority-select:focus { outline: none; border-color: #6366f1; }

    /* 削除ボタン */
    .delete-btn {
      background: none;
      border: none;
      color: #9ca3af;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      transition: color .2s, background .2s;
      line-height: 1;
      flex-shrink: 0;
    }

    .delete-btn:hover { color: #dc2626; background: #fef2f2; }

    /* ===== 空状態 ===== */
    #empty-msg {
      text-align: center;
      color: #9ca3af;
      font-size: .95rem;
      padding: 24px 0;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>📝 TODO リスト</h1>

  <!-- 新規追加フォーム -->
  <div class="input-row">
    <div class="input-controls">
      <input id="new-title" type="text" placeholder="やることを入力…" maxlength="200" />
      <select id="new-priority">
        <option value="1">高</option>
        <option value="2" selected>中</option>
        <option value="3">低</option>
      </select>
    </div>
    <button id="add-btn">追加</button>
  </div>

  <!-- エラーメッセージ表示エリア -->
  <div id="error-msg"></div>

  <!-- 絞り込みバー -->
  <div class="filter-row">
    <label for="filter-priority">絞り込み：</label>
    <select id="filter-priority">
      <option value="">すべて</option>
      <option value="1">高</option>
      <option value="2">中</option>
      <option value="3">低</option>
    </select>
  </div>

  <!-- TODO 一覧 -->
  <ul id="todo-list"></ul>
  <p id="empty-msg" style="display:none;">TODO がありません。追加してみましょう！</p>
</div>

<script>
  // ===== 定数 =====
  const PRIORITY_LABEL = { 1: '高', 2: '中', 3: '低' };

  // ===== DOM 参照 =====
  const listEl     = document.getElementById('todo-list');
  const inputEl    = document.getElementById('new-title');
  const priorityEl = document.getElementById('new-priority');
  const filterEl   = document.getElementById('filter-priority');
  const addBtn     = document.getElementById('add-btn');
  const errorEl    = document.getElementById('error-msg');
  const emptyEl    = document.getElementById('empty-msg');

  // ===== エラー表示ヘルパー =====
  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.style.display = 'block';
  }
  function clearError() {
    errorEl.style.display = 'none';
  }

  // ===== 空状態の切り替え =====
  function updateEmptyState() {
    emptyEl.style.display = listEl.children.length === 0 ? 'block' : 'none';
  }

  // ===== 全件取得して画面に描画する =====
  async function fetchAndRender() {
    const priority = filterEl.value;
    const url = priority ? `/todos?priority=${priority}` : '/todos';

    const res = await fetch(url);
    if (!res.ok) { showError('TODO の取得に失敗しました'); return; }
    const todos = await res.json();

    listEl.innerHTML = '';
    todos.forEach(renderItem);
    updateEmptyState();
  }

  // ===== TODO 1件を <li> として追加する =====
  function renderItem(todo) {
    const li = document.createElement('li');
    li.className = 'todo-item' + (todo.completed ? ' completed' : '');
    li.dataset.id = todo.id;

    // 完了チェックボックス
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = todo.completed;
    checkbox.setAttribute('aria-label', '完了にする');
    checkbox.addEventListener('change', () => toggleComplete(todo.id, checkbox.checked, li));

    // タイトル
    const span = document.createElement('span');
    span.className = 'todo-title';
    span.textContent = todo.title;

    // 優先度バッジ（カラーコード付き）
    const badge = document.createElement('span');
    badge.className = `priority-badge p${todo.priority}`;
    badge.textContent = PRIORITY_LABEL[todo.priority] ?? '中';

    // インライン優先度変更セレクト
    const pSelect = document.createElement('select');
    pSelect.className = 'priority-select';
    pSelect.setAttribute('aria-label', '優先度を変更');
    pSelect.dataset.prevPriority = todo.priority;
    [1, 2, 3].forEach(v => {
      const opt = document.createElement('option');
      opt.value = v;
      opt.textContent = PRIORITY_LABEL[v];
      if (v === todo.priority) opt.selected = true;
      pSelect.appendChild(opt);
    });
    pSelect.addEventListener('change', () =>
      changePriority(todo.id, Number(pSelect.value), badge, pSelect)
    );

    // 削除ボタン
    const delBtn = document.createElement('button');
    delBtn.className = 'delete-btn';
    delBtn.textContent = '✕';
    delBtn.setAttribute('aria-label', '削除');
    delBtn.addEventListener('click', () => deleteTodo(todo.id, li));

    li.append(checkbox, span, badge, pSelect, delBtn);
    listEl.appendChild(li);
  }

  // ===== 新規 TODO を追加する =====
  async function addTodo() {
    const title = inputEl.value.trim();
    const priority = parseInt(priorityEl.value, 10);

    if (!title) { showError('タイトルを入力してください'); return; }
    clearError();

    addBtn.disabled = true;
    try {
      const res = await fetch('/todos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, priority }),
      });

      if (!res.ok) {
        const body = await res.json();
        showError(body.error ?? '追加に失敗しました');
        return;
      }

      const todo = await res.json();
      inputEl.value = '';
      priorityEl.value = '2';

      // フィルター中かつ追加アイテムが対象外なら再描画のみ
      if (filterEl.value && String(todo.priority) !== filterEl.value) {
        await fetchAndRender();
      } else {
        renderItem(todo);
        updateEmptyState();
      }
    } finally {
      addBtn.disabled = false;
    }
  }

  // ===== 完了状態を切り替える =====
  async function toggleComplete(id, completed, liEl) {
    const res = await fetch(`/todos/${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ completed }),
    });

    if (!res.ok) {
      showError('更新に失敗しました');
      liEl.querySelector('input[type="checkbox"]').checked = !completed;
      return;
    }
    liEl.classList.toggle('completed', completed);
  }

  // ===== 優先度を変更する =====
  async function changePriority(id, priority, badgeEl, selectEl) {
    const prevPriority = Number(selectEl.dataset.prevPriority);

    const res = await fetch(`/todos/${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ priority }),
    });

    if (!res.ok) {
      showError('優先度の更新に失敗しました');
      // 失敗時は元の値に戻す
      selectEl.value = prevPriority;
      return;
    }

    selectEl.dataset.prevPriority = priority;
    badgeEl.className = `priority-badge p${priority}`;
    badgeEl.textContent = PRIORITY_LABEL[priority];

    // フィルター中かつ変更後が対象外になった場合は再描画
    if (filterEl.value && String(priority) !== filterEl.value) {
      await fetchAndRender();
    }
  }

  // ===== TODO を削除する =====
  async function deleteTodo(id, liEl) {
    const res = await fetch(`/todos/${id}`, { method: 'DELETE' });
    if (!res.ok) { showError('削除に失敗しました'); return; }
    liEl.remove();
    updateEmptyState();
  }

  // ===== イベント登録 =====
  addBtn.addEventListener('click', addTodo);
  inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') addTodo(); });
  inputEl.addEventListener('input', clearError);
  filterEl.addEventListener('change', fetchAndRender);

  // ===== 初期表示 =====
  fetchAndRender();
</script>

</body>
</html>
